services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"   # local tooling only; never exposed on the LAN
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # smtp4dev: #  just for testing mail server
  #   image: rnwood/smtp4dev:v3
  #   restart: always
  #   ports:
  #     - '5000:80'
  #     - '2525:25'
  #     - '143:143'
  #   volumes:
  #       - smtp4dev-data:/smtp4dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    restart: unless-stopped
    environment:
      SQLALCHEMY_DATABASE_URL: ${SQLALCHEMY_DATABASE_URL:?set SQLALCHEMY_DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    ports:
      - "127.0.0.1:8000:8000"   # Swagger for local development; the UI talks to it internally
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net
      - public_net
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public_net
    security_opt:
      - no-new-privileges:true

networks:
  internal_net:
    driver: bridge
  public_net:
    driver: bridge

volumes:
  postgres_data:
